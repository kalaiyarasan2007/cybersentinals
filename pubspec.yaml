name: student_insight_ai
description: "StudentInsight AI - AI-powered intelligent academic mentor"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^0.69.0

  # Storage
  shared_preferences: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Animations
  lottie: ^3.3.1
  animated_text_kit: ^4.2.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  percent_indicator: ^4.2.3

  # Calendar
  table_calendar: ^3.1.2

  # Image Picker (Profile Photo)
  image_picker: ^1.1.2

  # AI — Gemini Generative AI
  google_generative_ai: ^0.4.7

  # Firebase (service layer ready — activate when google-services.json is added)
  firebase_core: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
